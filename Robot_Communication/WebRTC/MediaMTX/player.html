<h2>MediaMTX WebRTC / WHEP Player</h2>

<!-- Video -->
<div class="video-container">
    <video
        id="videoPlayer"
        autoplay
        playsinline
        muted
        controls>
    </video>
</div>

<!-- Controls -->
<div class="panel">

    <div class="url-row">

        <input
            id="whepUrl"
            type="text"
            placeholder="Enter WHEP URL, e.g. https://192.168.123.235/vrstream/g1-vr180/whep"
        >

        <button onclick="startPlay()">
            Play / Reconnect
        </button>

        <button class="stop" onclick="stopPlay()">
            Stop
        </button>

    </div>

    <div class="status-row">
        <span id="status">
            Status: Ready
        </span>

        <span id="connection">
            WebRTC: -
        </span>
    </div>

    <div class="hint">
        Press Enter to connect. The URL is saved in your browser.
    </div>

</div>


<script>

    let pc = null;

    const videoEl = document.getElementById("videoPlayer");
    const statusEl = document.getElementById("status");
    const connectionEl = document.getElementById("connection");
    const urlInput = document.getElementById("whepUrl");


    // --------------------------------------------------
    // Load saved URL
    // --------------------------------------------------

    const savedUrl = localStorage.getItem("whepUrl");

    if (savedUrl) {
        urlInput.value = savedUrl;
    }


    // --------------------------------------------------
    // Enter key -> Play
    // --------------------------------------------------

    urlInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            startPlay();
        }

    });


    // --------------------------------------------------
    // Stop WebRTC
    // --------------------------------------------------

    function stopPlay() {

        if (pc) {
            pc.close();
            pc = null;
        }

        if (videoEl.srcObject) {

            videoEl.srcObject
                .getTracks()
                .forEach(track => track.stop());

            videoEl.srcObject = null;
        }

        statusEl.innerText = "Status: Stopped";
        connectionEl.innerText = "WebRTC: disconnected";
    }


    // --------------------------------------------------
    // Start WebRTC / WHEP
    // --------------------------------------------------

    async function startPlay() {

        const whepUrl = urlInput.value.trim();

        // Check URL
        if (!whepUrl) {

            statusEl.innerText =
                "Status: Please enter a WHEP URL";

            urlInput.focus();

            return;
        }


        // Save URL
        localStorage.setItem("whepUrl", whepUrl);


        // Close previous connection
        stopPlay();


        statusEl.innerText =
            "Status: Establishing WebRTC connection...";

        connectionEl.innerText =
            "WebRTC: connecting";


        // --------------------------------------------------
        // Create PeerConnection
        // --------------------------------------------------

        pc = new RTCPeerConnection({

            iceServers: [
                {
                    urls: "stun:stun.l.google.com:19302"
                }
            ]

        });


        // Receive video
        pc.addTransceiver(
            "video",
            {
                direction: "recvonly"
            }
        );


        // --------------------------------------------------
        // Receive remote track
        // --------------------------------------------------

        pc.ontrack = async function(event) {

            console.log("Received track:", event.track.kind);

            if (event.track.kind === "video") {

                videoEl.srcObject =
                    event.streams[0];

                try {

                    await videoEl.play();

                    statusEl.innerText =
                        "Status: Playing";

                } catch (err) {

                    console.warn(
                        "Autoplay failed:",
                        err
                    );

                    statusEl.innerText =
                        "Status: Video ready - press Play";
                }
            }
        };


        // --------------------------------------------------
        // Connection state
        // --------------------------------------------------

        pc.onconnectionstatechange = function() {

            const state =
                pc.connectionState;

            console.log(
                "WebRTC connection state:",
                state
            );

            connectionEl.innerText =
                `WebRTC: ${state}`;


            switch (state) {

                case "connected":

                    statusEl.innerText =
                        "Status: Playing";

                    break;


                case "connecting":

                    statusEl.innerText =
                        "Status: Connecting...";

                    break;


                case "disconnected":

                    statusEl.innerText =
                        "Status: Disconnected";

                    break;


                case "failed":

                    statusEl.innerText =
                        "Status: Connection failed";

                    break;


                case "closed":

                    statusEl.innerText =
                        "Status: Closed";

                    break;
            }
        };


        // --------------------------------------------------
        // ICE connection state
        // --------------------------------------------------

        pc.oniceconnectionstatechange = function() {

            console.log(
                "ICE state:",
                pc.iceConnectionState
            );

        };


        // --------------------------------------------------
        // WHEP request
        // --------------------------------------------------

        try {

            statusEl.innerText =
                "Status: Creating SDP offer...";


            const offer =
                await pc.createOffer();


            await pc.setLocalDescription(offer);


            statusEl.innerText =
                "Status: Sending WHEP request...";


            const response =
                await fetch(
                    whepUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/sdp"
                        },

                        body: offer.sdp
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Server returned ${response.status} ${response.statusText}`
                );
            }


            const answerSdp =
                await response.text();


            await pc.setRemoteDescription({

                type: "answer",

                sdp: answerSdp

            });


            statusEl.innerText =
                "Status: WebRTC negotiation completed";


        } catch (err) {

            console.error(
                "WHEP play failed:",
                err
            );


            statusEl.innerText =
                `Status: Play failed - ${err.message}`;


            connectionEl.innerText =
                "WebRTC: failed";


            if (pc) {

                pc.close();
                pc = null;

            }
        }

    }

</script>

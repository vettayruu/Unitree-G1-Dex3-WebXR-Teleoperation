worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 基础性能优化
    sendfile           on;
    tcp_nopush         on; 
    tcp_nodelay        on; # 关键：禁用 Nagle 算法，确保机器人控制指令零延迟
    keepalive_timeout  65;

    # --- 关键：定义 WebSocket 升级映射 ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 1. HTTP 自动跳转 HTTPS
    server {
        listen       80;
        server_name  liust.local localhost 127.0.0.1;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen       443 ssl default_server;
        server_name  liust.local localhost 127.0.0.1;

        # 证书路径 (请确保路径正确)
        ssl_certificate      "C:/Program Files/mosquitto/cert.pem";
        ssl_certificate_key  "C:/Program Files/mosquitto/key.pem";

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # --- 1. MQTT WebSocket ---
        location /mqtt {
            proxy_pass http://127.0.0.1:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # --- 2. BTP REST API (/offer) ---
        location /offer {
            proxy_pass http://127.0.0.1:8080/offer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location /device {
        #     proxy_pass http://127.0.0.1:8080/device;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        location /time {
            proxy_pass http://127.0.0.1:8080/time;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 3. Flask-SocketIO WebSocket 通道 ---
        location /socket.io {
            proxy_pass http://127.0.0.1:8080/socket.io;
            proxy_http_version 1.1;
            
            # 使用上面 map 定义的变量
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 机器人控制关键：禁用缓存
            proxy_buffering off;
            
            # 避免长连接被断开
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
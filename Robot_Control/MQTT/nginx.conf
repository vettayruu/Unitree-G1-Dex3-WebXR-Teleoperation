worker_processes  auto; # CPU Core Number

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on; 
    keepalive_timeout  65;

    # WebSocket Upgrade Header Mapping
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    upstream webserver {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # HTTP → HTTPS redirect
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  liust.local localhost;
        return 301   https://$host$request_uri;
    }

    # HTTPS Main Server
    server {
        listen       443 ssl default_server;
        listen       [::]:443 ssl default_server;
        server_name  liust.local localhost;

        # SSL certificate and key
        ssl_certificate      "C:/Program Files/mosquitto/cert.pem";
        ssl_certificate_key  "C:/Program Files/mosquitto/key.pem";

        # SSL security settings
        ssl_protocols        TLSv1.2 TLSv1.3; 
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off; 
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_session_tickets  off; 

        # Webserver → :3000
        location / {
            proxy_pass             http://webserver;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade           $http_upgrade;
            proxy_set_header       Connection        $connection_upgrade;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffering        off;
            proxy_connect_timeout  5s;
            proxy_read_timeout     86400s;
            proxy_send_timeout     86400s;
        }

        # 1. MQTT over WebSocket → Mosquitto :9001
        location /mqtt {
            proxy_pass             http://127.0.0.1:9001;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection $connection_upgrade;
            proxy_set_header       Host       $host;

            proxy_buffering        off;
            proxy_connect_timeout  5s;
            proxy_read_timeout     86400s;
            proxy_send_timeout     86400s;
        }

        # 2. Flask REST API → :8080
        location ~ ^/(offer|device|result|time)$ {
            proxy_pass             http://127.0.0.1:8080$request_uri;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
        }

        # 3. Flask-SocketIO WebSocket → :8080/socket.io
        location /socket.io {
            proxy_pass             http://127.0.0.1:8080/socket.io;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade           $http_upgrade;
            proxy_set_header       Connection        $connection_upgrade;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffering        off;  
            proxy_read_timeout     86400s;
            proxy_send_timeout     86400s;
        }
    }
}

worker_processes  auto; # 自动匹配 CPU 核心数

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 基础性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on; # 禁用 Nagle 算法，确保控制指令零延迟
    keepalive_timeout  65;

    # WebSocket 升级映射（供所有 WebSocket location 复用）
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # HTTP → HTTPS 重定向
    server {
        listen       80;
        server_name  liust.local localhost 127.0.0.1;
        return 301   https://$host$request_uri;
    }

    # HTTPS 主服务
    server {
        listen       443 ssl;
        server_name  liust.local localhost 127.0.0.1;

        # SSL 证书
        ssl_certificate      "C:/Program Files/mosquitto/cert.pem";
        ssl_certificate_key  "C:/Program Files/mosquitto/key.pem";

        # SSL 安全配置
        ssl_protocols        TLSv1.2 TLSv1.3; # 禁用不安全的旧版协议
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off; # TLS 1.3 下应关闭，由客户端选择最优算法
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_session_tickets  off; # 禁用 session ticket，提升前向保密性

        # ── 公共头部片段（用于普通 REST 代理）──────────────────────────
        # 在各 location 中手动复用，nginx 社区版不支持 include 在 location 内
        # ────────────────────────────────────────────────────────────────

        # 1. MQTT over WebSocket → Mosquitto :9001
        location /mqtt {
            proxy_pass             http://127.0.0.1:9001;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection $connection_upgrade; # 与 socket.io 统一
            proxy_set_header       Host       $host;
            proxy_read_timeout     86400s;
            proxy_send_timeout     86400s;
        }

        # 2. Flask REST API → :8080
        #    /offer、/device（备用）、/time 结构一致，统一归组
        location ~ ^/(offer|time)$ {
            proxy_pass             http://127.0.0.1:8080$request_uri;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
        }

        # 若需要启用 /device，将其加入上方正则即可：^/(offer|device|time)$

        # 3. Flask-SocketIO WebSocket → :8080/socket.io
        location /socket.io {
            proxy_pass             http://127.0.0.1:8080/socket.io;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade           $http_upgrade;
            proxy_set_header       Connection        $connection_upgrade;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffering        off;   # 禁用缓冲，确保实时控制指令即时传递
            proxy_read_timeout     86400s;
            proxy_send_timeout     86400s;
        }
    }
}
